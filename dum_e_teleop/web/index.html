<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dum-E jog
        </title>
        <script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
        <style>
            button {
                touch-action: none;
                user-select: none;
            }
        </style>
    </head>
    <body>
        <h1>Dum-E jog</h1>
        <p>Status: <span id="status">connecting...</span></p>
        <button id="test-button">Send one jog</button>
        <button id="elbow-plus">Elbow +</button>
        <button id="elbow-minus">Elbow -</button>

        <script>
            const statusText = document.getElementById("status");

            const ros = new ROSLIB.Ros({
                url: "ws://" + window.location.hostname + ":9090"
            });

            ros.on("connection", () => { statusText.textContent = "connected"; });
            ros.on("error",      () => { statusText.textContent = "error";});
            ros.on("close",      () => { statusText.textContent = "closed"});

            const jogTopic = new ROSLIB.Topic({
                ros: ros,
                name: "/joint_jog",
                messageType: "control_msgs/msg/JointJog"
            });

            const testButton = document.getElementById("test-button");
            testButton.addEventListener("click", () => {
                jogTopic.publish({
                    joint_names: ["elbow_pitch_joint"],
                    velocities: [0.3]
                });
            });

            // ---- hold-to-move: elbow + and - ----
            const elbowPlus = document.getElementById("elbow-plus");
            const elbowMinus = document.getElementById("elbow-minus");
            let holdTimer = null;

            const sendElbowPlus = () => {
                jogTopic.publish({
                    joint_names: ["elbow_pitch_joint"],
                    velocities: [0.3]
                });
            };

            const sendElbowMinus = () => {
                jogTopic.publish({
                    joint_names: ["elbow_pitch_joint"],
                    velocities: [-0.3]
                });
            };

            const stopHold = () => {
                clearInterval(holdTimer);
            };

            elbowPlus.addEventListener("pointerdown", () => {
                stopHold();
                holdTimer = setInterval(sendElbowPlus, 100);
            });
            elbowPlus.addEventListener("pointerup", stopHold);
            elbowPlus.addEventListener("pointerleave", stopHold);
            elbowPlus.addEventListener("pointercancel", stopHold);

            elbowMinus.addEventListener("pointerdown", () => {
                stopHold();
                holdTimer = setInterval(sendElbowMinus, 100);
            });
            elbowMinus.addEventListener("pointerup", stopHold);
            elbowMinus.addEventListener("pointerleave", stopHold);
            elbowMinus.addEventListener("pointercancel", stopHold);
        </script>
    </body>
</html>

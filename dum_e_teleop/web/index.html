<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dum-E jog</title>
        <script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
        <style>
            body {
                background: #f2f2f2;
                color: #111111;
                font-family: "Inter", sans-serif;
                margin: 16px;
            }
            h1 {
                font-family: "Space Grotesk", sans-serif;
                font-weight: 700;
                font-size: 40px;
                line-height: 0.85;
                letter-spacing: -0.05em;
                text-transform: uppercase;
                margin: 12px 0;
            }
            .grey {
                color: #6b6b6b;
            }
            .eyebrow {
                display: inline-block;
                border: 2px solid #111111;
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.1em;
            }
            .card {
                border: 1px solid #cfcfcf;
                margin: 8px 0;
                max-width: 480px;
            }
            .card-head {
                display: flex;
                justify-content: space-between;
                padding: 6px 12px;
                border-bottom: 1px solid #cfcfcf;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .card-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 12px;
            }
            .card-label {
                flex: 1;
                text-align: center;
                font-family: "Space Grtoesk", sans-serif;
                font-weight: 700;
                font-size: 20px;
                text-transform: uppercase;
            }
            button {
                touch-action: none;
                user-select: none;
                flex: 1;
                font-family: inherit;
                font-size: 26px;
                font-weight: 600;
                padding: 10px 0;
                background: #111111;
                color: #ffffff;
                border: none;
                border-radius: 0;
            }
        </style>
    </head>
    <body>
        <div class="eyebrow">■ JOG_CONSOLE</div>
        <h1>Dum-E<br><span class="grey">Jog console</span></h1>
        <p>Status: <span id="status">connecting...</span></p>
        <div id="joint-buttons"></div>

        <script>
            const statusText = document.getElementById("status");

            const ros = new ROSLIB.Ros({
                url: "ws://" + window.location.hostname + ":9090"
            });

            ros.on("connection", () => { statusText.textContent = "connected"; });
            ros.on("error",      () => { statusText.textContent = "error";});
            ros.on("close",      () => { statusText.textContent = "closed"});

            const jogTopic = new ROSLIB.Topic({
                ros: ros,
                name: "/joint_jog",
                messageType: "control_msgs/msg/JointJog"
            });

            // ---- hold-to-move ----
            let holdTimer = null;

            const stopHold = () => {
                clearInterval(holdTimer);
            };

            const makeHoldButton = (buttonId, jointName, speed) => {
                const button = document.getElementById(buttonId);

                const send = () => {
                    jogTopic.publish({
                        joint_names: [jointName],
                        velocities: [speed]
                    });
                };

                button.addEventListener("pointerdown", () => {
                    stopHold();
                    holdTimer = setInterval(send, 100);
                });
                button.addEventListener("pointerup", stopHold);
                button.addEventListener("pointerleave", stopHold);
                button.addEventListener("pointercancel", stopHold);
            };

            const JOINTS = [
                {name: "base_yaw_joint", label: "Base"},
                {name: "shoulder_pitch_joint", label: "Shoulder"},
                {name: "elbow_pitch_joint", label: "Elbow"},
                {name: "wrist_pitch_joint", label: "Wrist pitch"},
                {name: "wrist_roll_joint", label: "Wrist roll"},
            ];

            const jointButtons = document.getElementById("joint-buttons");

            let count = 0;
            
            for (const joint of JOINTS) {
                count = count + 1;

                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-head"><span>0${count}</span><span>${joint.name}</span></div>
                    <div class="card-row">
                        <button id="${joint.name}-minus">−</button>
                        <div class="card-label">${joint.label}</div>
                        <button id="${joint.name}-plus">+</button>
                    </div>
                `;
                jointButtons.appendChild(card);   

                makeHoldButton(joint.name + "-plus", joint.name, 0.3);
                makeHoldButton(joint.name + "-minus", joint.name, -0.3);
            }

        </script>
    </body>
</html>
